name: Validate Ghostwire AI

on:
  push:
    branches:
      - repair/ghostwire-platform
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
